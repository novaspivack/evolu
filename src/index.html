<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evolu</title>

<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* One committed night-field world: the map is the colour, the instruments stay quiet. */
  --ink: #090e12;
  --panel: #101920;
  --panel-2: #16232b;
  --line: #25363f;
  --text: #e6eee9;
  --muted: #8ea3a1;
  --accent: #f2b84b;   /* lamplight: the observer's hand */
  --life: #6fd38b;     /* energy, growth */
  --harm: #ef6a5b;     /* wounds, death */
  --mind: #9db4ff;     /* thought */
  --self: #e59bf0;     /* self-rewriting */
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  /* layout: a full-bleed world with instruments laid over it, and one inspector column */
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ink); color: var(--text); font-family: var(--body); font-size: 14px; line-height: 1.45; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { display: grid; grid-template-columns: minmax(0, 1fr) 420px; height: 100%; }
#stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #05080b; }
#world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#world.drag { cursor: grabbing; }

/* instruments over the world */
.hud { position: absolute; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
.hud > * { pointer-events: auto; }
#hudTop { top: 12px; left: 12px; right: 12px; justify-content: space-between; align-items: flex-start; flex-wrap: nowrap; gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; flex: none; }
.glass { background: rgba(12, 20, 26, 0.78); border: 1px solid rgba(120, 150, 160, 0.22); border-radius: 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
#brand { padding: 8px 14px 9px; display: flex; gap: 14px; align-items: center; }
#brand h1 { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; margin: 0; line-height: 1; }
#brand h1 span { color: var(--accent); }
#clock { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
#dial { width: 30px; height: 30px; }
#clock b { color: var(--text); font-weight: 600; }
#controls { padding: 6px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; max-width: 520px; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; font-weight: 500; white-space: nowrap; min-height: 32px; }
.btn:hover { border-color: #47626e; background: #1b2c36; }
.btn.icon { padding: 6px 9px; min-width: 32px; font-family: var(--mono); }
.btn.on { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #231802; font-weight: 600; }
.btn.primary:hover { background: #ffc965; }
.btn.primary.awake { background: #1d2a1f; color: var(--life); border-color: var(--life); }
.btn:disabled { opacity: 0.45; cursor: default; }
select.btn { padding-right: 6px; }
#meter { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; padding: 0 6px; white-space: nowrap; }
#meter b { color: var(--mind); }

#census { display: flex; gap: 6px; flex-wrap: wrap; max-width: 360px; }
.chip { padding: 4px 10px; font-size: 12px; color: var(--muted); border-radius: 999px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip b { color: var(--text); font-weight: 600; margin-right: 3px; }
.chip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

#notice { top: 128px; left: 50%; transform: translateX(-50%); max-width: min(560px, calc(100% - 24px)); padding: 9px 14px; border-color: var(--accent); color: var(--text); font-size: 13px; }
#notice[hidden] { display: none; }
#worldName { font-family: var(--display); font-weight: 600; font-size: 14px; color: var(--muted); white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
#chooser { top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100% - 24px)); max-height: calc(100% - 40px); overflow: auto; padding: 18px 20px; display: block; pointer-events: auto; border-color: var(--accent); z-index: 30; }
#chooser[hidden] { display: none; }
#chooser h2 { font-family: var(--display); font-size: 20px; margin: 0 0 12px; }
#chooser p { font-size: 12.5px; color: var(--muted); margin: 12px 0 0; }
#chooserNew { width: 100%; margin-top: 4px; padding: 10px; font-size: 15px; }
.world { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.world b { display: block; font-size: 14.5px; }
.world small { color: var(--muted); font-size: 12px; }
#notice button { margin-left: 10px; }

#hudBottom { left: 12px; bottom: 12px; align-items: flex-end; }
#mini { width: 176px; height: 120px; display: block; border-radius: 10px; cursor: crosshair; }
#miniWrap { padding: 5px; }
#hint { padding: 6px 11px; font-size: 12px; color: var(--muted); }
#hint kbd { font-family: var(--mono); font-size: 11px; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
#tip { position: absolute; pointer-events: none; padding: 5px 9px; font-size: 12px; max-width: 260px; z-index: 5; }
#tip[hidden] { display: none; }
#tip b { font-weight: 600; }

/* the inspector column */
#panel { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
#tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
#tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 7px 5px 8px; font-size: 12.5px; color: var(--muted); font-weight: 500; white-space: nowrap; }
#tabs button:hover { color: var(--text); }
#tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.pane { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 28px; overflow-wrap: anywhere; }
.pane[hidden] { display: none; }
.pane h2 { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; margin: 0; line-height: 1.15; text-wrap: balance; }
.pane h3 { font-family: var(--body); font-weight: 600; font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.pane h3 small { font-weight: 400; letter-spacing: 0; text-transform: none; }
.pane p { margin: 0 0 8px; }
.muted { color: var(--muted); }
.empty { color: var(--muted); padding: 18px 0; }
.empty b { color: var(--text); }

.who { display: flex; gap: 12px; align-items: center; }
.portrait { width: 76px; height: 76px; border-radius: 14px; background: radial-gradient(circle at 50% 60%, #22343e, #101920); border: 1px solid var(--line); flex: none; }
.who .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.who .doing { color: var(--accent); font-size: 12.5px; margin-top: 3px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.bars { display: grid; grid-template-columns: 62px 1fr 34px; gap: 5px 8px; align-items: center; margin-top: 12px; font-size: 12px; font-variant-numeric: tabular-nums; }
.bars .lab { color: var(--muted); }
.bars .num { text-align: right; }
.bar { height: 7px; border-radius: 4px; background: #0b1318; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; }
.traits { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.traits.moods { grid-template-columns: repeat(5, 1fr); margin-top: 6px; }
.traits.moods .trait { background: none; border: 1px solid var(--line); }
.trait { background: var(--panel-2); border-radius: 8px; padding: 5px 7px 6px; font-size: 11px; color: var(--muted); }
.trait .bar { height: 4px; margin-top: 4px; }
.kv { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.kv b { color: var(--text); font-weight: 500; }

.thinking { border: 1px dashed var(--mind); border-radius: 10px; padding: 8px 10px; margin-top: 12px; font-size: 12.5px; color: var(--mind); }
.thinking pre { margin: 6px 0 0; font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: pre-wrap; max-height: 120px; overflow: auto; }
.pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--mind); margin-right: 7px; animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; transform: scale(0.7); } }

.thought { border-left: 2px solid var(--mind); padding: 2px 0 2px 11px; margin: 0 0 13px; }
.thought.deep { border-left-color: var(--self); }
.thought.failed { border-left-color: var(--line); color: var(--muted); }
.thought .meta { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-bottom: 2px; }
.thought .meta em { font-style: normal; color: var(--self); }
.thought .t { font-style: italic; }
.thought .say { margin-top: 5px; background: var(--panel-2); border-radius: 9px; padding: 6px 9px; font-size: 13px; }
.thought .say b { color: var(--accent); font-weight: 600; }
.thought ul { margin: 5px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--muted); }
.thought li::before { content: "→ "; color: var(--self); }
.thought li.intent::before { color: var(--accent); }
  .thought li.memo::before { content: "✎ "; color: var(--mind); }
.thought li.test::before { content: "◌ "; color: var(--mind); }

.creed { font-family: var(--display); font-weight: 500; font-size: 15.5px; line-height: 1.4; border-left: 2px solid var(--self); padding-left: 11px; }
.old { font-size: 12px; color: var(--muted); margin-top: 8px; }
.old summary { cursor: pointer; }
.old div { margin: 6px 0 0 12px; text-decoration: line-through; text-decoration-color: #4a5c62; }
.rules { font-family: var(--mono); font-size: 11.5px; line-height: 1.5; margin: 0; padding: 0; list-style: none; counter-reset: r; }
.rules li { counter-increment: r; padding: 4px 0 4px 26px; position: relative; border-top: 1px solid #18252d; }
.rules li:first-child { border-top: 0; }
.rules li::before { content: counter(r); position: absolute; left: 0; color: var(--muted); width: 18px; text-align: right; }
.rules .k { color: var(--muted); }
.rules .a { color: var(--accent); }
.rules .u { color: var(--harm); }
.rules .why { display: block; color: var(--muted); font-family: var(--body); font-size: 11.5px; }
.notes { margin: 0; padding-left: 18px; }
.notes li { margin-bottom: 4px; }
.bond { display: grid; grid-template-columns: 78px 1fr 34px; gap: 8px; align-items: center; font-size: 12.5px; margin-bottom: 5px; font-variant-numeric: tabular-nums; }
.bond a, .link { color: var(--text); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; cursor: pointer; background: none; border: 0; padding: 0; }
.bond a:hover, .link:hover { text-decoration-color: var(--accent); }
.bond .bar { position: relative; }
.bond .bar i { position: absolute; top: 0; }
.events { margin: 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--muted); }
.events li { padding: 2px 0; }

.line { padding: 7px 0; border-top: 1px solid #18252d; font-size: 13px; }
.line:first-child { border-top: 0; }
.line .when { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.line .sp { color: var(--accent); font-weight: 600; }
.line .heard { font-size: 11.5px; color: var(--muted); }
.line.jump { cursor: pointer; }
.line.jump:hover { background: #131f27; }
.line.face { display: grid; grid-template-columns: 30px 1fr; gap: 9px; align-items: start; }
.line.face canvas { margin-top: 1px; }
.tag { display: inline-block; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 4px; padding: 0 5px; margin-right: 6px; background: var(--panel-2); color: var(--muted); }
.tag.death, .tag.fight { color: var(--harm); }
.tag.birth, .tag.gift, .tag.court { color: var(--life); }
.tag.self, .tag.design { color: var(--self); }
.tag.variety, .tag.law, .tag.sky, .tag.invention, .tag.culture { color: var(--accent); }
.planbox { margin-top: 10px; padding: 7px 10px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; font-size: 12.5px; }
.planbox b { color: var(--accent); font-weight: 600; margin-right: 6px; }
.people { border: 1px solid var(--line); border-left-width: 3px; border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.way { border-left: 2px solid var(--line); padding: 2px 0 6px 10px; margin: 0 0 10px; font-size: 12.5px; }
.way.known { border-left-color: var(--accent); }
.way > b { font-size: 14px; }
.kin { font-size: 12.5px; padding: 2px 0; }
.kin b { font-weight: 600; }
.tag.theft, .tag.power, .tag.war { color: var(--harm); }
.tag.sick { color: #a6dc5a; }
.tag.hunt { color: var(--harm); }
.tag.maker, .tag.story { color: var(--mind); }
.chapter { font-size: 14px; line-height: 1.6; color: var(--text); margin: 4px 0 14px; white-space: pre-wrap; }
.epi { margin: 2px 0 10px 14px; padding: 0 0 0 12px; border-left: 2px solid var(--accent); font-style: italic; font-size: 13px; line-height: 1.5; color: var(--text); opacity: 0.9; }
.epi cite { display: block; margin-top: 4px; font-style: normal; font-size: 11px; opacity: 0.7; }
.mk { border-left: 2px solid var(--mind); padding: 2px 0 2px 11px; margin: 0 0 13px; font-size: 13px; }
.mk .v { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.mk .v.kept { color: var(--life); } .mk .v.undone { color: var(--harm); } .mk .v.pending { color: var(--accent); }
.mk ul { margin: 4px 0; padding-left: 18px; } .mk .q { color: var(--muted); margin-top: 3px; }
.idea { font-size: 12.5px; padding: 2px 0; } .idea.done { color: var(--life); } .idea.dropped { color: var(--muted); text-decoration: line-through; }
.cseg { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.cseg button { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line, rgba(255,255,255,0.14)); background: transparent; color: var(--muted); cursor: pointer; }
.cseg button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); border-color: var(--accent); }
.cseg button i, .pdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.idea { border-left: 2px solid var(--accent); padding: 2px 0 2px 11px; margin: 0 0 13px; font-size: 13px; }
.idea.belief { border-left-color: var(--mind); } .idea.way { border-left-color: var(--life); } .idea.thing { border-left-color: var(--muted); }
.idea .t { font-weight: 600; } .idea .m { font-size: 11.5px; color: var(--muted); margin-top: 2px; } .idea blockquote { margin: 4px 0 2px; padding: 0; font-style: italic; line-height: 1.45; } .idea .alt { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.spread { width: 100%; border-collapse: collapse; font-size: 12.5px; } .spread td { padding: 4px 4px 4px 0; vertical-align: middle; border-top: 1px solid var(--line, rgba(255,255,255,0.08)); } .spread td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); } .spread svg { display: block; }
.tl { list-style: none; margin: 0; padding: 0; font-size: 12.5px; } .tl li { padding: 4px 0; border-top: 1px solid var(--line, rgba(255,255,255,0.08)); } .tl li b { font-weight: 600; } .tl .d { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
.nums { font-size: 12.5px; line-height: 1.7; color: var(--muted); } .nums b { color: var(--text); font-weight: 600; }
.thought .feel { font-size: 12.5px; color: var(--mind); font-style: italic; margin-top: 3px; }
.thought .feel .rut { font-style: normal; color: var(--harm); font-size: 11px; border: 1px solid currentColor; border-radius: 6px; padding: 0 5px; margin-left: 4px; }
.tie { font-size: 11.5px; color: var(--muted); padding: 1px 0 1px 12px; }
.tag.age, .tag.craft { color: var(--accent); }
.tag.magic, .tag.lore { color: var(--mind); }
.tag.trade, .tag.build { color: var(--life); }
#eco { width: 100%; height: 170px; display: block; background: #0b1318; border-radius: 10px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }

.kinds { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.kind { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px; text-align: center; }
.kind:hover { border-color: var(--accent); }
.kind canvas { width: 64px; height: 64px; display: block; margin: 0 auto 4px; }
.kind b { display: block; font-weight: 600; font-size: 13px; }
.kind span { font-size: 11px; color: var(--muted); }

details.grp { border-top: 1px solid var(--line); padding: 8px 0; }
details.grp summary { cursor: pointer; font-weight: 600; }
.laws { display: grid; grid-template-columns: 1fr 96px; gap: 5px 10px; align-items: center; margin-top: 8px; font-size: 12.5px; }
.laws label { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
input[type="number"], input[type="text"], .field { background: #0b1318; border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; width: 100%; font-variant-numeric: tabular-nums; }
.laws input.changed { border-color: var(--accent); color: var(--accent); }
.form { display: grid; grid-template-columns: 1fr 150px; gap: 8px 10px; align-items: center; }
.form label { color: var(--text); }
.form label small { display: block; color: var(--muted); font-size: 11.5px; }
.form select, .form input { width: 100%; }
input[type="range"] { accent-color: var(--accent); padding: 0; }
.note { font-size: 12.5px; color: var(--muted); background: var(--panel-2); border-radius: 10px; padding: 9px 11px; margin: 10px 0; }
.note b { color: var(--text); }

@media (max-width: 900px) {
  body { overflow: auto; }
  #app { grid-template-columns: 1fr; grid-template-rows: 62vh auto; height: auto; min-height: 100%; }
  #panel { border-left: 0; border-top: 1px solid var(--line); min-height: 60vh; }
  .pane { overflow: visible; }
  #hint, #miniWrap { display: none; }
  #brand h1 { font-size: 18px; }
  #hudTop { flex-wrap: wrap; }
  #controls { max-width: none; justify-content: flex-start; }
}
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <section id="stage" aria-label="The world">
    <canvas id="world"></canvas>
    <div class="hud" id="hudTop">
      <div class="stack">
        <div class="glass" id="brand">
          <h1>Evo<span>lu</span></h1><span id="worldName" title="The name of this world (change it in Setup)"></span>
          <div id="clock"><canvas id="dial" width="60" height="60"></canvas><span id="clockText">day 1</span></div>
        </div>
        <div id="census"></div>
      </div>
      <div class="glass" id="controls">
        <button class="btn icon" id="btnPlay" title="Pause or resume the world (Space)">❚❚</button>
        <select class="btn" id="selSpeed" title="How fast the world runs" aria-label="World speed">
          <option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option>
        </select>
        <button class="btn icon" id="btnOut" title="Zoom out (−)">−</button>
        <button class="btn icon" id="btnIn" title="Zoom in (+)">+</button>
        <button class="btn" id="btnFit" title="Show the whole world (0)">Whole world</button>
        <button class="btn" id="btnFollow" title="Keep the camera on the selected being (F)">Follow</button>
        <button class="btn" id="btnSound" title="Turn the soundscape on or off (M)">Sound off</button>
        <select class="btn" id="selAdd" title="How many people to add" aria-label="How many people to add"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select>
        <button class="btn" id="btnAdd" title="Bring this many newcomers into the land, in bands of up to four, of the peoples with fewest living">Add people</button>
        <button class="btn primary" id="btnMinds" title="Let the beings think with Claude">Wake minds</button>
        <span id="meter"><b>0</b> / 90 thoughts</span>
      </div>
    </div>
    <div class="hud glass" id="chooser" role="dialog" aria-label="Choose a world" hidden><h2>Which world?</h2><div id="chooserList"></div><button class="btn primary" id="chooserNew">Begin a new world</button><p id="chooserNote"></p></div>
    <div class="hud glass" id="notice" hidden><span id="noticeText"></span><button class="btn" id="noticeBtn">Dismiss</button></div>
    <div class="hud" id="hudBottom">
      <div class="glass" id="miniWrap"><canvas id="mini" width="352" height="240" title="Click to move the camera"></canvas></div>
      <div class="glass" id="hint">Drag to pan · scroll to zoom · click anything to inspect · <kbd>Space</kbd> pause · <kbd>F</kbd> follow</div>
    </div>
    <div class="glass" id="tip" hidden></div>
  </section>
